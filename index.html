<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prioridades">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Prioridades</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --txt:#f1f5f9; --mut:#94a3b8; --line:#334155;
    --red:#ef4444; --blue:#3b82f6; --amber:#f59e0b; --grey:#64748b; --ok:#22c55e; --link:#93c5fd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--link);outline-offset:2px}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
  header{padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:0}
  .sub{color:var(--mut);font-size:13px;padding:0 16px 8px;max-width:720px;margin:0 auto}
  main{padding:0 12px;max-width:720px;margin:0 auto}
  section{margin:14px 0}
  .sh{display:flex;align-items:center;gap:8px;padding:6px 4px}
  .dot{width:12px;height:12px;border-radius:50%}
  .sh h2{font-size:15px;margin:0;flex:1}
  .sh small{color:var(--mut);font-size:12px}
  .hint{color:var(--mut);font-size:12.5px;padding:0 4px 6px}
  .welcome{background:var(--card);border-radius:10px;padding:12px 14px;margin:12px 0 4px;color:var(--mut);font-size:14px}
  .welcome b{color:var(--txt)}
  .item{background:var(--card);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px 10px 2px;margin:8px 0;display:flex;gap:4px;align-items:flex-start}
  .chk{width:44px;height:44px;flex:none;margin:-11px 0 -11px 0;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;color:#fff;border-radius:50%}
  .chk .ring{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-size:14px;line-height:1;transition:border-color .15s,background .15s}
  .chk:hover .ring,.chk:active .ring{border-color:var(--c)}
  .chk.on .ring{background:var(--ok);border-color:var(--ok)}
  .item .body{flex:1;min-width:0;cursor:pointer;border-radius:6px}
  .item .t{font-weight:600;word-break:break-word}
  .item .m{font-size:12.5px;color:var(--mut);margin-top:2px;word-break:break-word}
  .tag{display:inline-block;font-size:11.5px;border-radius:99px;padding:1px 8px;background:var(--card2);color:var(--txt);margin-right:4px}
  .late{color:var(--red);font-weight:600}
  .empty{color:var(--mut);font-size:13px;padding:6px 4px;font-style:italic}
  details.done{margin-top:20px;color:var(--mut)}
  details.done summary{cursor:pointer;padding:6px 4px}
  details.done summary small{font-size:12px}
  details.done .item{opacity:.55}
  details.done .item .t{text-decoration:line-through}
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:32px;box-shadow:0 6px 18px #0008;cursor:pointer}
  .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;min-width:44px;min-height:40px}
  /* painel inferior */
  dialog{border:0;border-radius:18px 18px 0 0;background:var(--card);color:var(--txt);width:100%;max-width:560px;margin:auto auto 0;padding:0;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain}
  dialog::backdrop{background:#000a}
  .sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet-h{font-size:17px;margin:0;outline:none}
  label{display:block;font-weight:600;margin:14px 0 6px;font-size:14.5px}
  label span{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
  input[type=text],input[type=password],input[type=date],input[type=number],textarea{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:16px;font-weight:400;margin-top:4px} /* 16px: abaixo disto o iPhone faz zoom ao tocar e a página fica maior que o ecrã */
  @supports (-webkit-touch-callout:none){ /* iOS: campo de data vazio fica sem altura */
    input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
    input[type=date]::-webkit-date-and-time-value{text-align:left}
  }
  textarea{min-height:64px;resize:vertical}
  label.chkrow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;cursor:pointer}
  label.chkrow input{grid-row:span 2;width:22px;height:22px;margin:0;accent-color:var(--blue)}
  .seg{display:flex;gap:8px;border-radius:12px}
  .seg.need{outline:2px solid var(--red);outline-offset:3px}
  .seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit;cursor:pointer}
  .seg button.on{background:var(--blue);border-color:var(--blue);font-weight:700}
  .link{background:none;border:0;color:var(--link);text-decoration:underline;font:inherit;padding:0;cursor:pointer}
  .res{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--c);font-size:14px}
  .row{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;padding:13px;border-radius:10px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
  .btn.sec{background:var(--card2);color:var(--txt)}
  .btn.danger{background:#7f1d1d}
  .ok{color:var(--ok)} .bad{color:var(--red)}
  .hide{display:none!important}
  hr{border:0;border-top:1px solid var(--line);margin:18px 0 0}
  .toast{position:fixed;left:50%;width:max-content;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#020617;border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:99;display:flex;align-items:center;gap:6px;max-width:calc(100% - 32px);box-shadow:0 6px 18px #0008}
  .toast.act{padding:3px 4px 3px 16px}
  .toast button{background:none;border:0;color:var(--link);font:inherit;font-weight:700;padding:9px 12px;border-radius:99px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Prioridades</h1>
  <div style="display:flex;gap:8px">
    <button class="iconbtn" id="btnSync" aria-label="Sincronizar">☁</button>
    <button class="iconbtn" id="btnMenu" aria-label="Definições">⋯</button>
  </div>
</header>
<div class="sub">Urgência × Importância → ação</div>

<main id="app"></main>

<button class="fab" id="btnAdd" aria-label="Adicionar">+</button>

<!-- Formulário -->
<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form" class="sheet" autocomplete="off">
    <h2 id="dlgTitle" class="sheet-h" tabindex="-1">Nova entrada</h2>
    <label>O que é? <span>Tarefa, objetivo ou ideia</span>
      <input type="text" id="fTitle" required maxlength="200" placeholder="Ex.: Renovar seguro do carro">
    </label>

    <label>1 · Urgência — qual é a data limite para resolver?
      <input type="date" id="fDate">
    </label>
    <div class="seg" id="segU" role="group" aria-label="Urgência">
      <button type="button" data-v="0" aria-pressed="false">0 · Pouca</button>
      <button type="button" data-v="1" aria-pressed="false">1 · Muita</button>
    </div>
    <div class="hint" style="padding-top:6px"><span id="uHint"></span> <button type="button" class="link hide" id="uAuto">Usar a data</button></div>

    <label>2 · Importância — qual é o teu objetivo, meta ou resultado futuro com isto?
      <textarea id="fGoal" maxlength="2000" placeholder="Que resultado queres alcançar?"></textarea>
    </label>
    <div class="seg" id="segI" role="group" aria-label="Importância">
      <button type="button" data-v="0" aria-pressed="false">0 · Pouca</button>
      <button type="button" data-v="1" aria-pressed="false">1 · Muita</button>
    </div>

    <div class="res" id="res" aria-live="polite"></div>

    <label id="wWho" class="hide">Delegar a quem? <span>Opcional</span>
      <input type="text" id="fWho" maxlength="80">
    </label>
    <label id="wWhen" class="hide">Agendar para quando? <span>Opcional · nesse dia passa para "Fazer já"</span>
      <input type="date" id="fWhen">
    </label>

    <div class="row">
      <button type="button" class="btn sec" id="fCancel">Cancelar</button>
      <button type="button" class="btn danger hide" id="fDelete">Apagar</button>
      <button type="submit" class="btn" id="fSave">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Definições -->
<dialog id="dlgMenu" aria-labelledby="mTitle">
  <div class="sheet">
    <h2 id="mTitle" class="sheet-h" tabindex="-1">Definições</h2>
    <label>Sincronizar com GitHub
      <span>Repositório PRIVADO só para os dados: utilizador/nome</span>
      <input type="text" id="gRepo" placeholder="utilizador/prioridades-dados" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>Ficheiro
      <input type="text" id="gPath" placeholder="tasks.json" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>Token <span>Fine-grained, só neste repositório, Contents: Read and write</span>
      <input type="password" id="gToken" placeholder="github_pat_…" autocomplete="off">
    </label>
    <div class="hint" id="gMsg" aria-live="polite"></div>
    <div class="row">
      <button type="button" class="btn" id="gSave">Ligar e sincronizar</button>
      <button type="button" class="btn sec" id="gOff">Desligar</button>
    </div>
    <hr>
    <label>Urgente se a data limite for dentro de (dias)
      <span>Aplica-se logo a todas as tarefas com data e é sincronizado.</span>
      <input type="number" id="sDays" min="0" max="365" inputmode="numeric">
    </label>
    <label class="chkrow hide" id="wBadge"><input type="checkbox" id="sBadge"> Número no ícone da app
      <span>Mostra quantas tarefas tens em "Fazer já". No iPhone pede autorização de notificações.</span>
    </label>
    <div class="row">
      <button type="button" class="btn sec" id="bExport">Exportar cópia</button>
      <button type="button" class="btn sec" id="bImport">Importar</button>
    </div>
    <div class="row">
      <button type="button" class="btn sec" id="bClose">Fechar</button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" class="hide">
    <p class="hint" id="mFoot" style="margin-top:14px"></p>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
